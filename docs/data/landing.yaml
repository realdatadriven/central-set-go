# Note: Template blocks require a 'weight' parameter so they're correctly ordered on the landing page

# =========================
# Hero
# =========================
hero:
  enable: true
  weight: 10
  template: hero

  backgroundImage:
    path: "images/templates/hero"
    filename:
      desktop: "gradient-desktop.webp"
      mobile: "gradient-mobile.webp"

  badge:
    text: v0.1.0
    color: secondary
    pill: false
    soft: true

  title: "Central Set (CS)"
  subtitle: >
    A **configuration-driven data platform & Admin UI**
    built with **Golang**.
    Manage **applications, databases, users, roles, data pipelines,
    dashboards, and analytics** — all from one unified system.

  image:
    path: "images"
    filename: "CS-overview.gif"
    alt: "CS platform overview"
    boxShadow: true
    rounded: true

  ctaButton:
    icon: rocket_launch
    btnText: "Get Started"
    url: "./docs/quickstart/"

  cta2Button:
    icon: code
    btnText: "View on GitHub"
    url: "https://github.com/realdatadriven/central-set-go"

  info: "Golang • Multi-DB • API Access • ETLX & DuckDB Powered"

# =========================
# Feature Grid
# =========================
featureGrid:
  enable: true
  weight: 20
  template: feature grid

  title: Why Central Set?
  subtitle: >
    Most admin panels, data tools, and dashboards solve *one problem*.
    CS unifies **application management, data engineering,
    analytics, and governance** into a single, extensible platform.

  items:
    - title: Configuration-Driven Platform
      icon: settings
      description: >
        Define applications, schemas, CRUD behavior, dashboards,
        pipelines, and security using metadata — not custom code.
        Changes are reproducible, versionable, and auditable.

    - title: Built-In Admin UI
      icon: admin_panel_settings
      description: >
        Out-of-the-box admin UI with authentication, user management,
        role-based access control, and CRUD permissions
        at **table and operation level**.

    - title: Advanced CRUD UI Builder
      icon: table_view
      description: >
        Configure table views, forms, tabs, steps, subforms,
        and foreign-key selectors directly in the browser —
        no frontend code required.

    - title: Multi-Database Support
      icon: database
      description: >
        Works across SQLite, PostgreSQL, MySQL, and SQL Server.
        Manage multiple applications and databases
        from a single control plane.

    - title: ETLX-Powered Data Engineering
      icon: account_tree
      description: >
        Build visual, executable data workflows using ETLX.
        Run pipelines manually, programmatically,
        or via built-in job scheduling.

    - title: Job Scheduling & Automation
      icon: schedule
      description: >
        Native cron-style job scheduling for ETLX pipelines,
        maintenance tasks, and automated data processes —
        fully managed by the admin app.

    - title: Built-In Notebook & Exploration
      icon: terminal
      description: >
        Explore data quickly using a built-in notebook
        for ad-hoc queries, transformations,
        and rapid experimentation.

    - title: Configuration-Driven Dashboards
      icon: dashboard
      description: >
        [evidence.dev](https://docs.evidence.dev) like dashboards powered by Markdown configuration
        and **DuckDB-WASM** running directly in the browser.

    - title: Analytics & Data Sharing
      icon: analytics
      description: >
        Expose ETLX datasets via **Arrow Flight**
        to connect data engineering outputs
        directly with data science and analytics tools.

    - title: API-First & Extensible
      icon: api
      description: >
        Everything is exposed via REST-ish APIs.
        Access the platform using generated API keys and tokens,
        and build custom frontends, services,
        or integrations on top of CS.

    - title: API Access with Keys & Tokens
      icon: key
      description: >
        Generate access keys and tokens for secure API access.
        Authenticate external services, scripts, and applications
        with fine-grained permissions and role-based control.


# =========================
# Image Compare
# =========================
imageCompare:
  enable: true
  weight: 30
  template: image compare

  title: From Configuration to Operations & Analytics
  subtitle: >
    CS treats configuration as **the single source of truth** —
    powering CRUD apps, pipelines, dashboards,
    security, and automation.

  items:
    - title: Schema → Managed Application
      config:
        startingPoint: 50
        addCircle: true
        addCircleBlur: false
        showLabels: true
        labelOptions:
          before: "Database Schema"
          after: "Admin UI & CRUD"
          onHover: false
      imagePath: "images/screenshots"
      imageBefore: "CS_schema.png"
      imageAfter: "CS_crud_ui.png"

    - title: ETLX Config → Visual Workflow
      config:
        startingPoint: 45
        addCircle: true
        addCircleBlur: false
        showLabels: true
        labelOptions:
          before: "ETLX Configuration"
          after: "Visual Pipeline"
          onHover: false
      imagePath: "images/screenshots"
      imageBefore: "CS_etlx_config.png"
      imageAfter: "CS_etlx_visual.png"

    - title: Markdown → Interactive Dashboard
      config:
        startingPoint: 40
        addCircle: true
        addCircleBlur: true
        showLabels: true
        labelOptions:
          before: "Markdown Config"
          after: "DuckDB-WASM Dashboard"
          onHover: false
      imagePath: "images/screenshots"
      imageBefore: "CS_dashboard_md.png"
      imageAfter: "CS_dashboard_ui.png"
