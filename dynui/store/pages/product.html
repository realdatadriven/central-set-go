<!doctype html>
<html lang="{{ .Site.default_locale }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Data.product.product_name }} | {{ .Site.ui_name }}</title>
  <link rel="stylesheet" href="/dynui/{{ .Site.ui_slug }}/assets/store.css">
</head>
<body>
  {{ template "header" . }}
  <main class="container product-detail">
    <h1>{{ .Data.product.product_name }}</h1>
    <p>{{ .Data.product.product_desc }}</p>
    <strong>{{ .Data.product.sale_price }}</strong>
    <p><a href="/dynui/{{ .Site.ui_slug }}/products">Back to products</a></p>
  </main>
  {{ template "footer" . }}
</body>
</html>
