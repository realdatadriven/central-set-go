<!doctype html>
<html lang="{{ .Site.default_locale }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Page.page_title }} | {{ .Site.ui_name }}</title>
  <link rel="stylesheet" href="/dynui/{{ .Site.ui_slug }}/assets/store.css">
</head>
<body>
  {{ template "header" . }}
  <main class="container">
    <h1>{{ .Page.page_title }}</h1>
    <section class="product-grid">
      {{ range .Data.products }}
      <article class="product-card">
        <h2><a href="/dynui/{{ $.Site.ui_slug }}/products/{{ .product_id }}">{{ .product_name }}</a></h2>
        <p>{{ .product_desc }}</p><strong>{{ .sale_price }}</strong>
      </article>
      {{ else }}<p>No products are available.</p>{{ end }}
    </section>
  </main>
  {{ template "footer" . }}
</body>
</html>
