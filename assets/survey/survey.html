<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.survey_data.data.title}} | {{.Page.page_title}} - {{.UI.ui_name}}</title>
    <link href="https://unpkg.com/survey-core/survey-core.min.css" rel="stylesheet">
    <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui/survey-js-ui.min.js"></script>
    <!--<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>-->
</head>
<body>
    <div id="surveyElement" style="position:absolute;top:0;left:0;right:0;bottom:0;min-height:100%;height:100%"></div>
    <!-- Raw JSON -->
    <script id="survey-json" type="application/json">
        {{ .survey_data.data.survey_json }}
    </script>
    <!-- Raw Theme -->
    <script id="survey-theme" type="application/json">
        {{ .survey_data.data.survey_theme }}
    </script>
    <script>
        const save = (async (sender) => {
            try {
                const response = await fetch("/crud/survey/response", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(sender.data)
                });
                const result = await response.json();
                //console.log("Response:", result);
                if (result.success) {
                    // Success message
                    document.getElementById("surveyElement").innerHTML = `
                        <div class="alert alert-success">
                            Survey submitted successfully!
                        </div>
                    `;
                } else {
                    // Error message from backend
                    document.getElementById("surveyElement").innerHTML = `
                        <div class="alert alert-error">
                            ${result.msg}
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Request failed:", err);
                document.getElementById("surveyElement").innerHTML = `
                    <div class="alert alert-error">
                        Failed to submit survey.
                    </div>
                `;
            }
        });
        (() => {
            let surveyJson = {};
            let surveyTheme = {};
            // Parse survey JSON
            try {
                const text = document.getElementById("survey-json").textContent.trim();
                if (text) {
                    surveyJson = JSON.parse(text);
                }
            } catch (e) {
                console.error("Failed to parse survey JSON:", e);
                return;
            }
            // Parse theme JSON (optional)
            try {
                const text = document.getElementById("survey-theme").textContent.trim();
                if (text) {
                    surveyTheme = JSON.parse(text);
                }
            } catch (e) {
                console.warn("Failed to parse survey theme:", e);
            }
            const survey = new Survey.Model(surveyJson);
            if (Object.keys(surveyTheme).length) {
                survey.applyTheme(surveyTheme);
            }
            survey.onComplete.add((sender) => {
                console.log(JSON.stringify(sender.data, null, 2));
                save(sender);
            });
            survey.render(document.getElementById("surveyElement"));
        })();
    </script>
</body>
</html>
