{{- $instanceID := "" -}}
{{- if regexMatch "^[0-9]+$" (toString .PathParams.instance_id) -}}
  {{- $instanceID = .PathParams.instance_id -}}
{{- end -}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Process Instances</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-base-200">
  <header class="navbar bg-base-100 px-4 shadow-sm lg:px-8">
    <div class="flex-1"><a class="text-lg font-semibold" href="/ui/bpm">BPM Process Dashboard</a></div>
    <a class="btn btn-ghost btn-sm" href="/ui/bpm/instances">Process instances</a>
    <span class="text-sm text-base-content/70">{{.user.username}}</span>
  </header>

  <main class="mx-auto max-w-7xl space-y-8 p-4 lg:p-8">
    <div id="instance-results"
         hx-get="/ui/bpm/partial/instance_results?search={{urlquery (default "" .PathParams.search)}}&amp;status={{urlquery (default "" .PathParams.status)}}&amp;instance_id={{urlquery $instanceID}}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="alert">Loading process instances…</div>
    </div>
  </main>
</body>
</html>
